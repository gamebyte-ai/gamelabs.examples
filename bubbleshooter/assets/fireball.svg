<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core" cx="128" cy="128" r="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgb(255,240,150)"/>
      <stop offset="30%" stop-color="rgb(255,150,30)"/>
      <stop offset="65%" stop-color="rgb(200,40,10)"/>
      <stop offset="100%" stop-color="rgb(60,15,5)"/>
    </radialGradient>
    <radialGradient id="rim" cx="128" cy="128" r="128" gradientUnits="userSpaceOnUse">
      <stop offset="60%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="hl" cx="82" cy="77" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Core lava gradient: yellow centre → orange → deep red → near-black rim. -->
  <rect width="256" height="256" fill="url(#core)"/>
  <rect width="256" height="256" fill="url(#rim)"/>
  <rect width="256" height="256" fill="url(#hl)"/>
  <!-- Two scattered embers to suggest flame flicker. -->
  <circle cx="170" cy="100" r="6" fill="rgb(255,235,150)" opacity="0.85"/>
  <circle cx="95" cy="160" r="5" fill="rgb(255,220,120)" opacity="0.75"/>
</svg>
