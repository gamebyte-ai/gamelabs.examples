<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rim" cx="128" cy="128" r="128" gradientUnits="userSpaceOnUse">
      <stop offset="60%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="hl" cx="82" cy="77" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Slate body matches the bomb / fireball / settings family. -->
  <rect width="256" height="256" fill="rgb(46,58,82)"/>
  <rect width="256" height="256" fill="url(#rim)"/>
  <rect width="256" height="256" fill="url(#hl)"/>
  <!-- Sniper-style crosshair: outer ring + four cardinal tick marks
       gapping the cross at the centre, with a small filled centre dot. -->
  <g stroke="rgb(235,238,245)" stroke-width="9" fill="none" stroke-linecap="round">
    <circle cx="128" cy="128" r="62"/>
    <line x1="128" y1="36"  x2="128" y2="82"/>
    <line x1="128" y1="174" x2="128" y2="220"/>
    <line x1="36"  y1="128" x2="82"  y2="128"/>
    <line x1="174" y1="128" x2="220" y2="128"/>
  </g>
  <circle cx="128" cy="128" r="6" fill="rgb(235,238,245)"/>
</svg>
