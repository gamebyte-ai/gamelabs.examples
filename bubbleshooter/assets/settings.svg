<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rim" cx="128" cy="128" r="128" gradientUnits="userSpaceOnUse">
      <stop offset="60%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="hl" cx="82" cy="77" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Slate body matches bomb / fireball template so the settings button reads as part of the same family. -->
  <rect width="256" height="256" fill="rgb(46,58,82)"/>
  <rect width="256" height="256" fill="url(#rim)"/>
  <rect width="256" height="256" fill="url(#hl)"/>
  <!-- Gear silhouette: 8-tooth cog centred on the body, white with a darker hole. -->
  <g transform="translate(128 128)" fill="rgb(235,238,245)">
    <g>
      <rect x="-18" y="-92" width="36" height="40" rx="6"/>
      <rect x="-18" y="52" width="36" height="40" rx="6"/>
      <rect x="-92" y="-18" width="40" height="36" rx="6"/>
      <rect x="52" y="-18" width="40" height="36" rx="6"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-18" y="-92" width="36" height="40" rx="6"/>
      <rect x="-18" y="52" width="36" height="40" rx="6"/>
      <rect x="-92" y="-18" width="40" height="36" rx="6"/>
      <rect x="52" y="-18" width="40" height="36" rx="6"/>
    </g>
    <circle cx="0" cy="0" r="62"/>
    <circle cx="0" cy="0" r="22" fill="rgb(46,58,82)"/>
  </g>
</svg>
