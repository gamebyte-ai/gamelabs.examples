<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamelabsjs Bubble Shooter</title>
    <script>
      // Ad-network SDK shim. Real builds replace this per network (mraid,
      // FbPlayableAd, playableSDK, …); the shim lets the playable run
      // standalone in a browser for QA.
      window.playableSDK = window.playableSDK || {
        openStoreURL: function (url) {
          console.log("[playable] CTA ->", url);
          window.open(url, "_blank");
        },
        gameReady: function () {
          console.log("[playable] gameReady");
        },
        gameEnd: function () {
          console.log("[playable] gameEnd");
        },
      };
    </script>
  </head>
  <body>
    <div id="app">
      <div id="stage" aria-label="Game stage"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
